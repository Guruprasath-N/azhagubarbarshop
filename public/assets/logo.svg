<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="azhaguGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Background Badge -->
  <rect x="10" y="10" width="100" height="100" rx="16" fill="url(#bgGrad)" stroke="#27272A" stroke-width="2"/>
  
  <!-- Stylized Scissors & Lotus/Crown Symbol -->
  <g transform="translate(60, 60)">
    <!-- Left Blade -->
    <path d="M-22,-22 C-10,-5 -5,10 0,25 C5,10 10,-5 22,-22" fill="none" stroke="url(#azhaguGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Handles -->
    <circle cx="-16" cy="-24" r="10" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="16" cy="-24" r="10" fill="none" stroke="#10B981" stroke-width="3"/>
    <!-- Central Jewel Sparkle -->
    <path d="M0,0 L3,-8 L6,0 L3,8 Z" fill="#F59E0B"/>
  </g>

  <!-- Brand Typography -->
  <text x="130" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" letter-spacing="4" fill="#09090B">
    AZHAGU
  </text>
  <text x="132" y="90" font-family="monospace" font-weight="700" font-size="13" letter-spacing="3" fill="#059669">
    SOUTH INDIA SALON PLATFORM
  </text>
</svg>
